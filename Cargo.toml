[package]
name = "loh"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Logit- Harness: a persistent coding agent with revision-aware execution"
license = "MIT"

[dependencies]
anyhow = "1"
async-trait = "0.1"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
chromiumoxide = "0.9.1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
directories = "6"
futures = "0.3"
libc = "0.2"
portable-pty = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
rmcp = { version = "3.6", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

[dev-dependencies]
axum = "0.8"
rmcp = { version = "3.6", default-features = false, features = ["server", "transport-streamable-http-server"] }

[profile.release]
lto = "thin"
strip = "debuginfo"
