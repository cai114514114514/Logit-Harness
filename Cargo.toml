[package]
name = "weft"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A persistent coding agent with revision-aware execution"
license = "MIT"

[dependencies]
anyhow = "1"
async-trait = "0.1"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
futures = "0.3"
libc = "0.2"
portable-pty = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

[profile.release]
lto = "thin"
strip = "debuginfo"
